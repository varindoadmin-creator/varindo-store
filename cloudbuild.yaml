# Deploys the Varindo store (store.varindo.co.id) to Cloud Run service
# varindo-store on every push to main. It must never deploy to varindo-catalog:
# that service is the live varindo.co.id site, deployed from the
# varindo-catalog repo.
#
# The deploy step names only the image. It must never pass --set-env-vars or
# --set-secrets: those replace the service's whole set. Env and secrets stay
# managed on the service itself with --update-*/--remove-* (see DEPLOY.md).
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --network=cloudbuild
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-store:$COMMIT_SHA
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-store:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-store

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - varindo-store
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-store:$COMMIT_SHA
      - --region=asia-southeast1
      - --quiet

images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-store:$COMMIT_SHA
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-store:latest

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
