# Deploys varindo.co.id to Cloud Run on every push to main (trigger:
# varindo-catalog-deploy-main, region asia-southeast2 — where the GitHub
# connection lives; the service itself runs in asia-southeast1). Same image
# `gcloud run deploy varindo-catalog --source .` built — the root Dockerfile —
# but built from the pushed commit, so production only ever runs committed code.
#
# The deploy step names only the image. It must never pass --set-env-vars or
# --set-secrets: those replace the service's whole set and would drop the SMTP,
# VIABooks, Anthropic, or Voyage configuration. Env and secrets stay managed on
# the service itself with --update-*/--remove-* (see DEPLOY.md).
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --network=cloudbuild
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-catalog:$COMMIT_SHA
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-catalog:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-catalog

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - varindo-catalog
      - --image=asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-catalog:$COMMIT_SHA
      - --region=asia-southeast1
      - --quiet

images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-catalog:$COMMIT_SHA
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/varindo-catalog:latest

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
