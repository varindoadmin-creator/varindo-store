plugins {
    id 'com.android.application'
}

android {
    namespace 'co.varindo.catalog'
    compileSdk {
        version = release(36) {
            it.minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId 'co.varindo.catalog'
        minSdk 21
        targetSdk 36
        versionCode 8
        versionName '1.3.1'
    }

    def keystorePath = providers.gradleProperty('VARINDO_UPLOAD_KEYSTORE').orNull
    def keystorePassword = providers.gradleProperty('VARINDO_UPLOAD_STORE_PASSWORD').orNull
    def keyAliasName = providers.gradleProperty('VARINDO_UPLOAD_KEY_ALIAS').orElse('varindo').get()
    def keyPasswordValue = providers.gradleProperty('VARINDO_UPLOAD_KEY_PASSWORD').orNull

    signingConfigs {
        if (keystorePath && keystorePassword && keyPasswordValue) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
}
